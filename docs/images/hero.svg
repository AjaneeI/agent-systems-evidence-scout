<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">Agent Systems Evidence Scout</title>
<desc id="desc">Evidence-controlled research agents: retrieve, verify, synthesize, enforce.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1527"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4f8cff"/><stop offset=".5" stop-color="#7768ff"/><stop offset="1" stop-color="#39d8c3"/></linearGradient>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f7f9ff}.muted{fill:#9fb0cd}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</defs>
<rect width="1400" height="360" rx="24" fill="url(#bg)"/>
<text x="70" y="70" class="t mono" font-size="14" letter-spacing="7" fill="#7ea7e8">AGENT SYSTEMS</text>
<text x="70" y="142" class="t" font-size="58" font-weight="750">Evidence <tspan fill="#5d8cff">Scout</tspan></text>
<text x="70" y="190" class="t" font-size="25" font-weight="600">Evidence-controlled research agents.</text>
<text x="70" y="226" class="t muted" font-size="19">Let the model choose the research path. Keep citation verification deterministic.</text>
<rect x="70" y="270" width="1260" height="2" fill="url(#line)"/>
<text x="70" y="314" class="t mono" font-size="15" fill="#76a9ff">RETRIEVE</text><text x="183" y="314" class="t muted" font-size="18">→</text>
<text x="220" y="314" class="t mono" font-size="15" fill="#8b7cff">VERIFY</text><text x="315" y="314" class="t muted" font-size="18">→</text>
<text x="352" y="314" class="t mono" font-size="15" fill="#6e9cff">SYNTHESIZE</text><text x="480" y="314" class="t muted" font-size="18">→</text>
<text x="517" y="314" class="t mono" font-size="15" fill="#48dbc7">ENFORCE</text>
<text x="920" y="314" class="t mono" font-size="14" fill="#dce6f8">19 TESTS</text>
<text x="1030" y="314" class="t muted" font-size="16">·</text>
<text x="1055" y="314" class="t mono" font-size="14" fill="#dce6f8">4-STEP LIVE RUN</text>
<text x="1220" y="314" class="t muted" font-size="16">·</text>
<text x="1245" y="314" class="t mono" font-size="14" fill="#48dbc7">CODE GATE</text>
</svg>