name: UI Smoke

on:
  pull_request:
    paths:
      - "app.py"
      - "ui_state.py"
      - "requirements.txt"
      - "tests/browser_smoke.py"
      - ".github/workflows/ui-smoke.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Launch Evidence Scout
        run: |
          python app.py > /tmp/evidence-scout.log 2>&1 &
          echo $! > /tmp/evidence-scout.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7860 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/evidence-scout.log
          exit 1
      - name: Run browser smoke
        run: python tests/browser_smoke.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-scout-ui-preview
          path: /tmp/evidence-scout-ui
          if-no-files-found: warn
